<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Sueldo Neto España</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen py-10 px-4">
  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
    <div class="mb-6 border-b border-slate-100 pb-4">
      <h1 class="text-2xl font-bold text-slate-900">Calculadora de Sueldo Neto</h1>
      <p class="text-sm text-slate-500 mt-1">Calcula tu salario neto mensual en España según tramos de IRPF y Seguridad Social.</p>
    </div>

    <!-- فرم ورودی‌ها -->
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Salario Bruto Anual (€)</label>
        <input type="number" id="grossSalary" value="24000" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Pagas al año</label>
          <select id="pagas" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option value="12">12 pagas</option>
            <option value="14">14 pagas</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Régimen</label>
          <select id="regimen" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option value="empleado">Empleado (General)</option>
            <option value="autonomo">Autónomo (Tarifa plana / estándar)</option>
          </select>
        </div>
      </div>

      <button onclick="calculateSalary()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors mt-2">
        Calcular Neto
      </button>
    </div>

    <!-- بخش نتایج -->
    <div id="results" class="mt-8 pt-6 border-t border-slate-100">
      <div class="bg-blue-50/70 border border-blue-100 rounded-xl p-5 text-center mb-6">
        <span class="text-xs font-semibold uppercase tracking-wider text-blue-600">Sueldo Neto Estimado</span>
        <div class="text-4xl font-extrabold text-blue-900 mt-1" id="netMonthlyDisplay">1.620 € / mes</div>
        <span class="text-xs text-blue-600/80 mt-1 block" id="annualNetSubtitle">Neto anual: 19.440 €</span>
      </div>

      <div class="space-y-2 text-sm">
        <div class="flex justify-between py-1.5 border-b border-slate-100">
          <span class="text-slate-600">Retención IRPF media:</span>
          <span class="font-medium text-slate-900" id="irpfDisplay">12.5%</span>
        </div>
        <div class="flex justify-between py-1.5 border-b border-slate-100">
          <span class="text-slate-600">Seguridad Social / Cuota mensual:</span>
          <span class="font-medium text-slate-900" id="ssDisplay">127 € / mes</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    function calculateSalary() {
      const gross = parseFloat(document.getElementById('grossSalary').value) || 0;
      const pagas = parseInt(document.getElementById('pagas').value);
      const regimen = document.getElementById('regimen').value;

      let ssYearly = 0;
      let irpfRate = 0;

      // محاسبه تقریبی IRPF بر اساس براکت‌های استاندارد
      if (gross <= 12450) irpfRate = 0.09;
      else if (gross <= 20200) irpfRate = 0.12;
      else if (gross <= 35200) irpfRate = 0.15;
      else if (gross <= 60000) irpfRate = 0.21;
      else irpfRate = 0.28;

      if (regimen === 'empleado') {
        ssYearly = gross * 0.0635; // سهم کارمند برای تأمین اجتماعی
      } else {
        ssYearly = 300 * 12; // میانگین سهم ماهانه آتونومو
      }

      const totalDeductions = (gross * irpfRate) + ssYearly;
      const netYearly = Math.max(0, gross - totalDeductions);
      const netMonthly = netYearly / pagas;

      document.getElementById('netMonthlyDisplay').textContent = `${Math.round(netMonthly).toLocaleString('es-ES')} € / mes`;
      document.getElementById('annualNetSubtitle').textContent = `Neto anual: ${Math.round(netYearly).toLocaleString('es-ES')} €`;
      document.getElementById('irpfDisplay').textContent = `${(irpfRate * 100).toFixed(1)}%`;
      document.getElementById('ssDisplay').textContent = `${Math.round(ssYearly / 12).toLocaleString('es-ES')} € / mes`;
    }

    calculateSalary();
  </script>
</body>
</html>
